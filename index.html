<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="preload" as="image" href="img/nasa-worm-logo-optimized.png" />
  <style>
    /* Critical CSS - Inline for faster FCP/LCP */
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Trebuchet MS',Verdana,Arial,sans-serif;background:radial-gradient(ellipse at 15% 40%, rgba(228,0,43,0.5) 0%, rgba(228,0,43,0.2) 25%, transparent 60%),radial-gradient(ellipse at 50% 50%, rgba(0,50,160,0.3) 0%, rgba(0,50,160,0.1) 35%, transparent 75%),linear-gradient(180deg, #0032A0 0%, #001E5C 20%, #0032A0 40%, #001A50 60%, #000D2B 100%);background-attachment:fixed;min-height:100vh;padding:20px;color:#E8E8E8;position:relative;overflow-x:hidden}body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(2px 2px at 10% 20%,#fff,rgba(0,0,0,0)),radial-gradient(1.5px 1.5px at 20% 80%,#fff,rgba(0,0,0,0)),radial-gradient(1px 1px at 40% 40%,#fff,rgba(0,0,0,0)),radial-gradient(2px 2px at 60% 10%,#fff,rgba(0,0,0,0)),radial-gradient(1.5px 1.5px at 75% 60%,#fff,rgba(0,0,0,0)),radial-gradient(1px 1px at 90% 30%,#fff,rgba(0,0,0,0)),radial-gradient(1.5px 1.5px at 50% 70%,#fff,rgba(0,0,0,0)),radial-gradient(1px 1px at 25% 50%,#fff,rgba(0,0,0,0));background-repeat:repeat;background-size:250px 250px;opacity:.7;pointer-events:none;z-index:1;animation:twinkle 8s ease-in-out infinite}body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 15% 40%, rgba(228,0,43,0.15) 0%, transparent 50%),radial-gradient(circle at 50% 50%, rgba(0,50,160,0.12) 0%, transparent 55%);pointer-events:none;z-index:0}@keyframes twinkle{0%,100%{opacity:.7}25%{opacity:.5}50%{opacity:.8}75%{opacity:.4}}.container{max-width:1200px;margin:0 auto;position:relative;z-index:2}.site-header{display:flex;align-items:center;justify-content:center;padding:20px;margin-bottom:20px;background:linear-gradient(135deg,#0032A0 0%,#001E5C 100%);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1)}h1{font-family:'Trebuchet MS',Verdana,sans-serif;font-weight:700;color:#fff;font-size:32px}.logo{width:140px;margin-right:15px}.filters{display:flex;flex-direction:column;gap:15px;justify-content:center;margin-bottom:20px;padding:20px;background-color:rgba(255,255,255,.95);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.date-input-wrapper{display:flex;flex-direction:column;gap:8px}.date-input-wrapper label{font-weight:600;color:#0032A0;font-size:14px;letter-spacing:.3px}input[type=date],button{font-family:Arial,sans-serif;font-weight:400;color:#666;padding:12px 15px;border:1px solid #ddd;border-radius:4px;font-size:16px;line-height:1.4;width:100%}input[type=date]:focus{outline:2px solid #E4002B;outline-offset:2px;border-color:#0032A0}button{background-color:#0032A0;color:#fff;cursor:pointer;font-weight:600;transition:all .3s ease;border:2px solid #0032A0;margin-top:5px}button:hover:not(:disabled){background-color:#001E5C;border-color:#001E5C;box-shadow:0 4px 12px rgba(0,50,160,.3);transform:translateY(-2px)}button:focus{outline:2px solid #E4002B;outline-offset:2px}button:disabled{background-color:#bfbfbf;border-color:#999;cursor:not-allowed;opacity:.6}@media (min-width:600px){.filters{flex-direction:row;padding:20px;gap:15px;align-items:flex-end}.date-input-wrapper{flex:1}button{flex:0 0 auto;width:auto;min-width:150px;margin-top:0}}main{display:block}.space-fact{background:linear-gradient(135deg,#0032A0 0%,#001E5C 100%);border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1)}.fact-content{color:#fff;font-size:16px;line-height:1.6;display:block}.fact-content strong{display:block;font-size:18px;margin-bottom:8px;font-weight:700;letter-spacing:.5px}.gallery{display:flex;flex-wrap:wrap;gap:20px;padding:20px;justify-content:center;min-height:200px}.gallery-loading{width:100%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-weight:600;animation:pulse 1.5s ease-in-out infinite;padding:60px 20px}@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}.placeholder{text-align:center;padding:40px;color:#aaa}.placeholder-icon{font-size:48px;margin-bottom:20px}.placeholder p{font-size:16px;color:#999}
  </style>
  <link href="style.min.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo-optimized.png" alt="NASA Logo" class="logo" width="140" height="39" />
      <h1>Space Explorer</h1>
    </header>

    <main>
      <form class="filters" aria-label="Date range filter">
        <div class="date-input-wrapper">
          <label for="startDate">Start Date:</label>
          <input type="date" id="startDate" required />
        </div>
        <div class="date-input-wrapper">
          <label for="endDate">End Date:</label>
          <input type="date" id="endDate" required />
        </div>
        <button type="submit">Get Space Images</button>
      </form>

      <!-- Random Space Fact Section -->
      <div id="spaceFact" class="space-fact"></div>

      <div id="gallery" class="gallery">
        <div class="placeholder">
          <div class="placeholder-icon">🔭</div>
          <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Loading indicator -->
  <div id="loadingIndicator" class="loading-indicator" style="display: none;">
    <div class="spinner"></div>
    <p class="loading-text">Exploring the cosmos...</p>
  </div>

  <!-- Modal for viewing full image details -->
  <div id="imageModal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" aria-label="Close modal">&times;</button>
      <div class="modal-image-wrapper">
        <img id="modalImage" src="" alt="" />
      </div>
      <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <p id="modalDate" class="modal-date"></p>
        <p id="modalExplanation" class="modal-explanation"></p>
      </div>
    </div>
  </div>

  <script defer src="js/dateRange.min.js"></script>
  <script defer src="js/script.min.js"></script>
</body>
</html>
